name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && format('release-{0}', github.ref_name) || format('ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Warehouse.StockEngine.slnx

      - name: Build
        run: dotnet build Warehouse.StockEngine.slnx --no-restore --configuration Release

      # NBomber endurance load tests stay local (excluded from CI; see issue #22).
      - name: Test
        run: >
          dotnet test Warehouse.StockEngine.slnx
          --no-build
          --configuration Release
          --verbosity normal
          --filter FullyQualifiedName!~StockEngineLoadTests

  publish:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NUGET_FEED: https://nuget.pkg.github.com/rvduuren/index.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve and validate release version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v ]]; then
            echo "Tag must start with v: $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if [[ ! "$VERSION" =~ $SEMVER_RE ]]; then
            echo "Tag is not SemVer 2.0 after removing v prefix: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Warehouse.StockEngine.slnx

      - name: Pack NuGet packages
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          mkdir -p artifacts
          dotnet pack src/Warehouse.StockEngine.Core/Warehouse.StockEngine.Core.csproj \
            --configuration Release \
            --no-restore \
            -p:PackageVersion="$VERSION" \
            -o artifacts
          dotnet pack src/Warehouse.StockEngine.Infrastructure.MariaDb/Warehouse.StockEngine.Infrastructure.MariaDb.csproj \
            --configuration Release \
            --no-restore \
            -p:PackageVersion="$VERSION" \
            -o artifacts

      - name: Push packages to GitHub Packages
        run: |
          shopt -s nullglob
          nupkgs=(artifacts/*.nupkg)
          if [ "${#nupkgs[@]}" -eq 0 ]; then
            echo "No .nupkg files found" >&2
            exit 1
          fi
          for pkg in "${nupkgs[@]}"; do
            dotnet nuget push "$pkg" \
              --source "$NUGET_FEED" \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --skip-duplicate
          done
