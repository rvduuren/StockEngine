name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Warehouse.StockEngine.slnx

      - name: Build
        run: dotnet build Warehouse.StockEngine.slnx --no-restore --configuration Release

      # NBomber endurance load tests stay local (excluded from CI; see issue #22).
      - name: Test
        run: >
          dotnet test Warehouse.StockEngine.slnx
          --no-build
          --configuration Release
          --verbosity normal
          --filter FullyQualifiedName!~StockEngineLoadTests
